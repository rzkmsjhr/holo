name: Release Pulse Audio (Android & iOS)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use version from pubspec.yaml)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk pulse-audio-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-audio-android-apk
          path: pulse-audio-release.apk
          retention-days: 1

  build-ios:
    name: Build iOS Sideloadable IPA
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS scaffolding
        run: flutter create . --platforms=ios --org com.example

      - name: Setup App Icon and Info.plist
        run: |
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp assets/icons/app_logo_1024.png ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true

      - name: Disable Code Signing in Xcode Project
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "0000000000"; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Flutter iOS build configs
        run: flutter build ios --config-only --release --no-codesign

      - name: Compile Unsigned iOS Runner.app
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into Sideloadable IPA
        run: |
          APP_PATH=$(find build/ -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r pulse-audio-sideload.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-audio-ios-ipa
          path: pulse-audio-sideload.ipa
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    if: always() && needs.build-android.result == 'success'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[ ]*//' | tr -d '\r')
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v$VERSION"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: pulse-audio-android-apk
          path: release-assets

      - name: Download iOS IPA
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: pulse-audio-ios-ipa
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.TAG }}
          name: Pulse Audio ${{ steps.release_meta.outputs.TAG }}
          draft: false
          prerelease: false
          files: |
            release-assets/pulse-audio-release.apk
            release-assets/*.ipa
          body: |
            ### Pulse Audio Mobile Release (${{ steps.release_meta.outputs.TAG }})

            High-fidelity mobile music player with YouTube streaming and studio-grade Lossless FLAC elevation.

            ---

            ### 📦 Download & Installation

            #### 📱 Android:
            1. Download **`pulse-audio-release.apk`** below directly to your device.
            2. Tap to install (enable *"Install from Unknown Sources"* if prompted).

            #### 🍏 iOS (Sideloading):
            1. Download **`pulse-audio-sideload.ipa`** below.
            2. Open **AltStore**, **Sideloadly**, or **TrollStore** on your computer/phone.
            3. Sideload the IPA using your free Apple ID.
            4. Enable Background Audio under system settings if desired.
