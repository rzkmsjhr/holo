name: Build iOS IPA (Sideloading)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA (Option A - Sideloading)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS scaffolding
        run: flutter create . --platforms=ios --org com.example

      - name: Enable background audio playback in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r pulse-audio-sideload.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-audio-ios-ipa
          path: pulse-audio-sideload.ipa
          retention-days: 14
